# Reference fragment only. Validate with nginx -t, adapt hosts/upstreams, and review before deployment.
# Include the zones in http{} and location fragments in the TLS server{}.
# Trust forwarded IP headers ONLY from enumerated load-balancer/CDN addresses; never 0.0.0.0/0.
limit_req_zone $binary_remote_addr zone=nuers_edge:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=nuers_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=nuers_connections:20m;

