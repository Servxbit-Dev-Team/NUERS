; Reference only. Replace /srv/nuers, user, PHP path, log paths after deployment review.
[program:nuers-queue]
command=/usr/bin/php /srv/nuers/artisan queue:work database --sleep=1 --tries=3 --timeout=90 --max-time=3600
user=nuers
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/nuers/queue.log
[program:nuers-scheduler]
command=/usr/bin/php /srv/nuers/artisan schedule:work
user=nuers
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/nuers/scheduler.log
; Note: the application does not dispatch Laravel queue jobs (its outboxes are database tables handled by the scheduled commands),
; so the nuers-queue workers above currently have nothing to process. Keep them only if queued jobs are introduced.

; Merchant callback delivery. Run several copies: each leases its own deliveries (MySQL 8 SKIP LOCKED, READ COMMITTED), so they do
; not wait on each other. Start with 4, then raise numprocs by watching the backlog (merchant_webhook_deliveries in pending/retry
; with available_at in the past) against receiver latency. Each worker exits after --max-runtime seconds and supervisor restarts it.
; Keep autostart=false until egress and destinations have been reviewed and enabled for delivery; the scheduler's per-minute
; merchant-webhooks:work stays as a fallback and does not conflict.
[program:nuers-merchant-webhooks]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /srv/nuers/artisan merchant-webhooks:work --watch --idle-sleep=1 --max-runtime=3600
user=nuers
numprocs=4
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/nuers/merchant-webhooks.log
; The EIS worker uses the blocked built-in provider. Binding an official adapter is a separately reviewed release.

; Transactional mail worker — activate only after outbound notification authorization.
; Set NUERS_NOTIFICATION_DISPATCH_ENABLED=true only after outbound rollout approval.
; Uses encrypted platform_mail_settings, not environment MAIL_* credentials.
[program:nuers-notifications]
command=/usr/bin/php /srv/nuers/artisan notifications:work --watch --limit=25
user=nuers
numprocs=1
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/nuers/notifications.log
; The existing scheduler provides a minute-based fallback and hourly reminder reconciliation.
; Do not manually replay uncertain SMTP outcomes; confirm receipt before a new customer request.
