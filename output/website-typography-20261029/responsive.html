<!doctype html><html><head><meta charset="UTF-8"><title>NUERS responsive typography review</title><style>body{margin:16px;background:#e9eff7;font:15px system-ui;color:#123057}h1{font-size:20px;margin:0 0 10px}iframe{display:block;border:1px solid #bccfe7;background:#fff;transform-origin:top left}pre{white-space:pre-wrap;font-size:13px}</style></head><body><h1 id="label"></h1><pre id="metrics">Measuring rendered layout…</pre><div id="frame-wrap"><iframe title="NUERS responsive preview"></iframe></div><script>
const width=Number(location.hash.slice(1)||1440);const frame=document.querySelector('iframe');frame.width=width;frame.height=900;frame.src='/?preview='+width;const scale=Math.min(1,(innerWidth-32)/width);frame.style.transform='scale('+scale+')';document.querySelector('#frame-wrap').style.height=(900*scale)+'px';document.querySelector('#label').textContent='NUERS · '+width+'px viewport (scale '+scale.toFixed(2)+')';
setInterval(()=>{const doc=frame.contentDocument;const win=frame.contentWindow;if(!doc.querySelector('.lp-header'))return;const items=Array.from(doc.querySelectorAll('.lp-header .lp-brand,.lp-nav,.lp-header-actions,.lp-menu-toggle,.lp-login,.lp-header-actions>.lp-button')).map(e=>{const r=e.getBoundingClientRect(),s=win.getComputedStyle(e);return {element:e.className,font:s.fontSize,display:s.display,left:Math.round(r.left),right:Math.round(r.right),top:Math.round(r.top),bottom:Math.round(r.bottom)}});document.querySelector('#metrics').textContent=JSON.stringify({viewport:width,scrollWidth:doc.documentElement.scrollWidth,items});},500);
</script></body></html>
